- title: TIP-Editor
  subtitle: 'TIP-Editor: An Accurate 3D Editor Following Both Text-Prompts And Image-Prompts'
  image: images/tip_editor.png
  link: https://openi.pcl.ac.cn/IMAEI/TIP-Editor/
  description: TIP-Editor is a 3D scene editing framework that combines text, image prompts, and a 3D bounding box to enable accurate control over the appearance and placement of the edited content, utilizing a stepwise 2D personalization strategy and 3D Gaussian splatting for precise local editing.
